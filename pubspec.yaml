name: pack_fit
description: "PackFit: Group Fitness Goals — Workout Timer & Accountability"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  google_sign_in: ^6.2.0
  sign_in_with_apple: ^6.0.0
  go_router: ^14.0.0
  wakelock_plus: ^1.2.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  fonts:
    - family: DSEG7Classic
      fonts:
        - asset: assets/fonts/DSEG7Classic-Bold.ttf
          weight: 700

  assets:
    - assets/fonts/
